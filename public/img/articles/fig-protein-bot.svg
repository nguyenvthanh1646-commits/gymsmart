<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Bổ sung protein khi tập kháng lực: mức tăng thêm so với không bổ sung</title><desc id="d">Sức mạnh 1RM tăng thêm 2,49 kg (0,64 đến 4,33). Khối nạc tăng thêm 0,30 kg (0,09 đến 0,52). Khoảng tin cậy 95%.</desc>
<rect width="900" height="262" rx="14" fill="#fcfcfb"/>
<text x="24" y="30" font-size="17" font-weight="800" fill="#0b0b0b">Bổ sung protein khi tập kháng lực: mức tăng thêm so với không bổ sung</text>
<line x1="390.9" y1="70" x2="390.9" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="390.9" y="220" text-anchor="middle" font-size="14" fill="#52514e">0</text><line x1="452.7" y1="70" x2="452.7" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="452.7" y="220" text-anchor="middle" font-size="14" fill="#52514e">1</text><line x1="514.5" y1="70" x2="514.5" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="514.5" y="220" text-anchor="middle" font-size="14" fill="#52514e">2</text><line x1="576.4" y1="70" x2="576.4" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="576.4" y="220" text-anchor="middle" font-size="14" fill="#52514e">3</text><line x1="638.2" y1="70" x2="638.2" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="638.2" y="220" text-anchor="middle" font-size="14" fill="#52514e">4</text><line x1="700.0" y1="70" x2="700.0" y2="200" stroke="#e6e5e0" stroke-width="1"/><text x="700.0" y="220" text-anchor="middle" font-size="14" fill="#52514e">5</text><line x1="390.9" y1="64" x2="390.9" y2="200" stroke="#0b0b0b" stroke-width="2"/><text x="390.9" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">0 = không khác biệt</text><text x="24" y="98" font-size="16" font-weight="700" fill="#0b0b0b">Sức mạnh tối đa (1RM)</text><text x="24" y="118" font-size="13" fill="#52514e">tăng thêm, đơn vị kg</text><line x1="430.5" y1="101" x2="658.6" y2="101" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="430.5" y1="94" x2="430.5" y2="108" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="658.6" y1="94" x2="658.6" y2="108" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="544.8" cy="101" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="106" font-size="15" font-weight="600" fill="#0b0b0b">+2,49 kg (0,64 đến 4,33)</text><text x="24" y="160" font-size="16" font-weight="700" fill="#0b0b0b">Khối nạc (không tính mỡ)</text><text x="24" y="180" font-size="13" fill="#52514e">tăng thêm, đơn vị kg</text><line x1="396.5" y1="163" x2="423.1" y2="163" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="396.5" y1="156" x2="396.5" y2="170" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="423.1" y1="156" x2="423.1" y2="170" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="409.5" cy="163" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="168" font-size="15" font-weight="600" fill="#0b0b0b">+0,30 kg (0,09 đến 0,52)</text><text x="530" y="244" text-anchor="middle" font-size="14" fill="#52514e">Chênh lệch trung bình so với không bổ sung (kg)</text><text x="24" y="260" font-size="12.5" fill="#52514e">Nguồn: Morton và cs., Br J Sports Med 2018. 49 thử nghiệm, 1.863 người. Mức tăng nhỏ nhưng có ý nghĩa thống kê.</text></svg>