<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Hiệu ứng tăng cơ: tập mỗi nhóm cơ ít buổi hay nhiều buổi mỗi tuần</title><desc id="d">Phân tích 2016, 10 nghiên cứu: hiệu ứng 0,49 với tần suất cao hơn và 0,30 với tần suất thấp hơn (P = 0,002).</desc>
<rect width="900" height="256" rx="14" fill="#fcfcfb"/>
<text x="24" y="30" font-size="17" font-weight="800" fill="#0b0b0b">Hiệu ứng tăng cơ: tập mỗi nhóm cơ ít buổi hay nhiều buổi mỗi tuần</text>
<line x1="330" y1="64" x2="330" y2="204" stroke="#52514e" stroke-width="1.5"/><text x="24" y="96" font-size="16" font-weight="700" fill="#0b0b0b">Tần suất cao hơn</text><text x="24" y="116" font-size="13" fill="#52514e">từ 2 buổi mỗi nhóm cơ trở lên</text><path d="M330 80 H628.2 a4 4 0 0 1 4 4 V108 a4 4 0 0 1 -4 4 H330 Z" fill="#2a78d6"/><text x="642.2" y="102" font-size="16" font-weight="700" fill="#0b0b0b">0,49</text><text x="24" y="160" font-size="16" font-weight="700" fill="#0b0b0b">Tần suất thấp hơn</text><text x="24" y="180" font-size="13" fill="#52514e">1 buổi mỗi nhóm cơ</text><path d="M330 144 H511.0 a4 4 0 0 1 4 4 V172 a4 4 0 0 1 -4 4 H330 Z" fill="#eb6834"/><text x="525.0" y="166" font-size="16" font-weight="700" fill="#0b0b0b">0,30</text><text x="515" y="232" text-anchor="middle" font-size="14" fill="#52514e">Hiệu ứng trung bình lên mức tăng cơ (đã chuẩn hóa)</text><text x="24" y="252" font-size="12.5" fill="#52514e">Nguồn: Schoenfeld và cs., Sports Med 2016. Bản cập nhật 2019 (25 nghiên cứu) thấy khác biệt biến mất khi cân bằng tổng số hiệp.</text></svg>