<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Cơ hoành khi hít vào và khi thở ra</title><desc id="d">Hai sơ đồ nhìn từ trước: thở ra cơ hoành vồng lên, phổi nhỏ lại; hít vào cơ hoành hạ xuống và dẹt đi, phổi nở ra, sườn và bụng nở sang hai bên</desc><rect width="900" height="480" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Cơ hoành chuyển động thế nào khi thở</text><rect x="135" y="90" width="200" height="290" rx="60" fill="#f4ede6" stroke="#52514e" stroke-width="2"/><ellipse cx="235" cy="190" rx="90" ry="105" fill="#fff" stroke="#52514e" stroke-width="2" stroke-dasharray="6 5"/><path d="M147.6 215 A90 105 0 1 1 322.4 215 Q235 153 147.6 215 Z" fill="#cfe3ff" stroke="#2a78d6" stroke-width="2.5"/><path d="M147.6 215 Q235 153 322.4 215" fill="none" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><text x="269" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2a78d6">phổi</text><path d="M235 210 L235 158" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><path d="M226 168 L235 157 L244 168" fill="none" stroke="#eb6834" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="360" text-anchor="middle" font-size="12.5" fill="#52514e">bụng</text><rect x="547" y="90" width="236" height="290" rx="60" fill="#f4ede6" stroke="#52514e" stroke-width="2"/><ellipse cx="665" cy="190" rx="98" ry="105" fill="#fff" stroke="#52514e" stroke-width="2" stroke-dasharray="6 5"/><path d="M569.8 215 A98 105 0 1 1 760.2 215 Q665 237 569.8 215 Z" fill="#cfe3ff" stroke="#2a78d6" stroke-width="2.5"/><path d="M569.8 215 Q665 237 760.2 215" fill="none" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><text x="699" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2a78d6">phổi</text><path d="M665 196 L665 250" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><path d="M656 240 L665 251 L674 240" fill="none" stroke="#eb6834" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M559 250 L527 250" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><path d="M537 242 L526 250 L537 258" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M771 250 L803 250" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><path d="M793 242 L804 250 L793 258" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="665" y="360" text-anchor="middle" font-size="12.5" fill="#52514e">bụng</text><text x="235" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#52514e">Thở ra</text><text x="235" y="442" text-anchor="middle" font-size="14" fill="#52514e">cơ hoành vồng lên, phổi nhỏ lại</text><text x="665" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#2a78d6">Hít vào</text><text x="665" y="442" text-anchor="middle" font-size="14" fill="#52514e">cơ hoành hạ xuống, sườn và bụng nở ra</text><rect x="690" y="20" width="12" height="12" rx="3" fill="#eb6834"/><text x="708" y="31" font-size="13.5" fill="#52514e">Cơ hoành</text><text x="450" y="472" text-anchor="middle" font-size="12.5" fill="#52514e"></text><text x="24" y="470" font-size="12.5" fill="#52514e">Sơ đồ minh họa tự vẽ, đơn giản hóa, không theo tỷ lệ.</text></svg>