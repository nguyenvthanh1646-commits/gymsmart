<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Hóp bụng và gồng bụng nhìn trên mặt cắt ngang</title><desc id="d">Hai sơ đồ mặt cắt ngang thân người: hóp bụng chỉ kéo thành bụng phía trước vào trong, gồng bụng siết đều toàn bộ vòng quanh thân 360 độ</desc><rect width="900" height="430" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Hóp bụng khác gồng bụng thế nào</text><ellipse cx="235" cy="215" rx="140" ry="100" fill="#f4ede6" stroke="#52514e" stroke-width="2"/><ellipse cx="235" cy="215" rx="122" ry="83" fill="none" stroke="#9db8e6" stroke-width="18" opacity=".9"/><ellipse cx="235" cy="215" rx="100" ry="64" fill="#fbe3d6"/><circle cx="235" cy="275" r="17" fill="#fff" stroke="#52514e" stroke-width="2.5"/><path d="M235 292 v14" stroke="#52514e" stroke-width="5" stroke-linecap="round"/><text x="235" y="223" text-anchor="middle" font-size="13" fill="#52514e">nội tạng</text><path d="M235 83 L235 119" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><path d="M228 110 L235 119 L242 110" fill="none" stroke="#eb6834" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 91 L189 127" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><path d="M182 118 L189 127 L196 118" fill="none" stroke="#eb6834" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 91 L281 127" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><path d="M274 118 L281 127 L288 118" fill="none" stroke="#eb6834" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="665" cy="215" rx="140" ry="100" fill="#f4ede6" stroke="#52514e" stroke-width="2"/><ellipse cx="665" cy="215" rx="122" ry="83" fill="none" stroke="#9db8e6" stroke-width="18" opacity=".9"/><ellipse cx="665" cy="215" rx="100" ry="64" fill="#fbe3d6"/><circle cx="665" cy="275" r="17" fill="#fff" stroke="#52514e" stroke-width="2.5"/><path d="M665 292 v14" stroke="#52514e" stroke-width="5" stroke-linecap="round"/><text x="665" y="223" text-anchor="middle" font-size="13" fill="#52514e">nội tạng</text><path d="M738 215 L794 215" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M794 215 L783 208" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M794 215 L783 222" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M717 246 L756 275" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M756 275 L751 262" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M756 275 L743 274" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M613 246 L574 275" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M574 275 L587 274" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M574 275 L579 262" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M592 215 L536 215" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M536 215 L547 222" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M536 215 L547 208" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M613 184 L574 155" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M574 155 L579 168" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M574 155 L587 156" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M665 172 L665 131" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M665 131 L658 142" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M665 131 L672 142" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M717 184 L756 155" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M756 155 L743 156" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><path d="M756 155 L751 168" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/><text x="235" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#eb6834">Hóp bụng (hollowing)</text><text x="235" y="374" text-anchor="middle" font-size="14" fill="#52514e">kéo rốn vào, chỉ thành bụng phía trước</text><text x="665" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#2a78d6">Gồng bụng (bracing)</text><text x="665" y="374" text-anchor="middle" font-size="14" fill="#52514e">siết đều trước, hai bên và lưng (360°)</text><text x="70" y="100" font-size="12.5" fill="#52514e">▲ trước</text><text x="500" y="100" font-size="12.5" fill="#52514e">▲ trước</text><text x="258" y="285" font-size="12" fill="#52514e">cột sống</text><text x="688" y="285" font-size="12" fill="#52514e">cột sống</text><text x="450" y="412" text-anchor="middle" font-size="12.5" fill="#52514e">Sơ đồ minh họa tự vẽ, không theo tỷ lệ. Khái niệm theo Grenier và McGill, Arch Phys Med Rehabil 2007. Vòng xanh nhạt = các cơ thành bụng.</text></svg>