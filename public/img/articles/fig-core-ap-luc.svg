<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Áp lực trong ổ bụng theo từng bài tập nặng</title><desc id="d">Áp lực ổ bụng: squat trên 200 mmHg; deadlift, slide row và leg press từ 161 đến 176 mmHg; đẩy ngực tạ đòn trung bình 79 mmHg, độ lệch chuẩn 44</desc><rect width="900" height="380" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Áp lực trong ổ bụng khi tập nặng (mmHg)</text><line x1="300" y1="64" x2="300" y2="300" stroke="#e6e5e0"/><text x="300" y="322" text-anchor="middle" font-size="13" fill="#52514e">0</text><line x1="423" y1="64" x2="423" y2="300" stroke="#e6e5e0"/><text x="423" y="322" text-anchor="middle" font-size="13" fill="#52514e">50</text><line x1="545" y1="64" x2="545" y2="300" stroke="#e6e5e0"/><text x="545" y="322" text-anchor="middle" font-size="13" fill="#52514e">100</text><line x1="668" y1="64" x2="668" y2="300" stroke="#e6e5e0"/><text x="668" y="322" text-anchor="middle" font-size="13" fill="#52514e">150</text><line x1="791" y1="64" x2="791" y2="300" stroke="#e6e5e0"/><text x="791" y="322" text-anchor="middle" font-size="13" fill="#52514e">200</text><text x="286" y="106" text-anchor="end" font-size="15" font-weight="600" fill="#0b0b0b">Squat tạ nặng</text><rect x="300" y="86" width="491" height="28" rx="5" fill="#eb6834"/><path d="M795 90 L813 100 L795 110" fill="none" stroke="#eb6834" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="821" y="105" font-size="14" font-weight="700" fill="#0b0b0b">trên 200</text><text x="286" y="178" text-anchor="end" font-size="15" font-weight="600" fill="#0b0b0b">Deadlift, slide row, leg press</text><rect x="695" y="158" width="37" height="28" rx="5" fill="#eb6834" opacity=".85"/><text x="744" y="177" font-size="14" font-weight="700" fill="#0b0b0b">161 đến 176</text><text x="286" y="250" text-anchor="end" font-size="15" font-weight="600" fill="#0b0b0b">Đẩy ngực tạ đòn</text><rect x="300" y="230" width="194" height="28" rx="5" fill="#2a78d6"/><line x1="386" y1="244" x2="602" y2="244" stroke="#0b0b0b" stroke-width="2.5"/><line x1="386" y1="236" x2="386" y2="252" stroke="#0b0b0b" stroke-width="2.5"/><line x1="602" y1="236" x2="602" y2="252" stroke="#0b0b0b" stroke-width="2.5"/><text x="614" y="249" font-size="14" font-weight="700" fill="#0b0b0b">79 ± 44</text><text x="880" y="352" text-anchor="end" font-size="12.5" fill="#52514e">Thanh = giá trị báo cáo; đoạn kẻ = trung bình ± độ lệch chuẩn. Nguồn: Blazek và cs., Biol Sport 2019 (16 nghiên cứu).</text><text x="880" y="370" text-anchor="end" font-size="12.5" fill="#52514e">Squat chỉ ghi "trên 200", nên thanh dừng ở 200 kèm mũi tên.</text></svg>