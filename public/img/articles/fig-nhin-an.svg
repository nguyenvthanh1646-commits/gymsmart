<title id="t">Thay đổi cân nặng sau 12 tháng: ăn trong khung giờ so với chỉ giảm calo</title><desc id="d">Cân nặng thay đổi: nhóm khung giờ cộng giảm calo −8,0 kg (−9,6 đến −6,4); nhóm chỉ giảm calo −6,3 kg (−7,8 đến −4,7); chênh lệch −1,8 kg (−4,0 đến 0,4), P = 0,11.</desc>
<rect width="900" height="324" rx="14" fill="#fcfcfb"/>
<text x="24" y="30" font-size="17" font-weight="800" fill="#0b0b0b">Thay đổi cân nặng sau 12 tháng: ăn trong khung giờ so với chỉ giảm calo</text>
<line x1="386.2" y1="70" x2="386.2" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="386.2" y="282" text-anchor="middle" font-size="14" fill="#52514e">−10</text><line x1="438.5" y1="70" x2="438.5" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="438.5" y="282" text-anchor="middle" font-size="14" fill="#52514e">−8</text><line x1="490.8" y1="70" x2="490.8" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="490.8" y="282" text-anchor="middle" font-size="14" fill="#52514e">−6</text><line x1="543.1" y1="70" x2="543.1" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="543.1" y="282" text-anchor="middle" font-size="14" fill="#52514e">−4</text><line x1="595.4" y1="70" x2="595.4" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="595.4" y="282" text-anchor="middle" font-size="14" fill="#52514e">−2</text><line x1="647.7" y1="70" x2="647.7" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="647.7" y="282" text-anchor="middle" font-size="14" fill="#52514e">0</text><line x1="700.0" y1="70" x2="700.0" y2="262" stroke="#e6e5e0" stroke-width="1"/><text x="700.0" y="282" text-anchor="middle" font-size="14" fill="#52514e">2</text><line x1="647.7" y1="64" x2="647.7" y2="262" stroke="#0b0b0b" stroke-width="2"/><text x="647.7" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">0 = không khác biệt</text><text x="24" y="98" font-size="16" font-weight="700" fill="#0b0b0b">Khung giờ ăn + giảm calo</text><text x="24" y="118" font-size="13" fill="#52514e">nhóm can thiệp</text><line x1="396.6" y1="101" x2="480.3" y2="101" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="396.6" y1="94" x2="396.6" y2="108" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="480.3" y1="94" x2="480.3" y2="108" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="438.5" cy="101" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="106" font-size="15" font-weight="600" fill="#0b0b0b">−8,0 kg (−9,6 đến −6,4)</text><text x="24" y="160" font-size="16" font-weight="700" fill="#0b0b0b">Chỉ giảm calo mỗi ngày</text><text x="24" y="180" font-size="13" fill="#52514e">nhóm đối chứng</text><line x1="443.7" y1="163" x2="524.8" y2="163" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="443.7" y1="156" x2="443.7" y2="170" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="524.8" y1="156" x2="524.8" y2="170" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><circle cx="482.9" cy="163" r="8" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="168" font-size="15" font-weight="600" fill="#0b0b0b">−6,3 kg (−7,8 đến −4,7)</text><text x="24" y="222" font-size="16" font-weight="700" fill="#0b0b0b">Chênh lệch giữa hai nhóm</text><text x="24" y="242" font-size="13" fill="#52514e">khoảng tin cậy chạm mốc 0</text><line x1="543.1" y1="225" x2="658.2" y2="225" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round"/><line x1="543.1" y1="218" x2="543.1" y2="232" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round"/><line x1="658.2" y1="218" x2="658.2" y2="232" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round"/><path d="M590.6 225 L600.6 215 L610.6 225 L600.6 235 Z" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="230" font-size="15" font-weight="600" fill="#0b0b0b">−1,8 kg (−4,0 đến 0,4)</text><text x="530" y="306" text-anchor="middle" font-size="14" fill="#52514e">Thay đổi cân nặng sau 12 tháng (kg)</text><text x="24" y="322" font-size="12.5" fill="#52514e">Nguồn: Liu và cs., N Engl J Med 2022. 139 người béo phì, 118 người hoàn thành. P = 0,11: chưa kết luận được khác biệt.</text></svg>