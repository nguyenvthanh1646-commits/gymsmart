<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Luyện thở bằng cơ hoành trong 3 bước</title><desc id="d">Ba bước: đặt tay, hít vào để bụng và sườn nở, thở ra chậm</desc><rect width="900" height="290" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Luyện thở bằng cơ hoành trong 3 bước</text><rect x="24" y="54" width="273" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="58" cy="92" r="20" fill="#2a78d6"/><text x="58" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="88" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Đặt tay</text><text x="42" y="140" font-size="14" fill="#52514e">Nằm ngửa, gối cao, một</text><text x="42" y="166" font-size="14" fill="#52514e">tay lên ngực, một tay lên</text><text x="42" y="192" font-size="14" fill="#52514e">bụng trên rốn</text><rect x="313" y="54" width="273" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="347" cy="92" r="20" fill="#2a78d6"/><text x="347" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="377" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Hít bằng mũi</text><text x="331" y="140" font-size="14" fill="#52514e">Hít chậm khoảng 4 giây:</text><text x="331" y="166" font-size="14" fill="#52514e">tay ở bụng nâng lên,</text><text x="331" y="192" font-size="14" fill="#52514e">tay ở ngực gần như đứng yên</text><rect x="603" y="54" width="273" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="637" cy="92" r="20" fill="#2a78d6"/><text x="637" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="667" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Thở ra chậm</text><text x="621" y="140" font-size="14" fill="#52514e">Thở ra qua miệng khoảng</text><text x="621" y="166" font-size="14" fill="#52514e">6 giây, bụng xẹp lại,</text><text x="621" y="192" font-size="14" fill="#52514e">lặp 5 đến 10 lần mỗi lượt</text><text x="24" y="256" font-size="12.5" fill="#52514e">Số giây chỉ là gợi ý thực hành để bắt đầu, không phải liều từ nghiên cứu. Chóng mặt hoặc khó chịu thì dừng và thở bình thường.</text></svg>