<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Nguy cơ tử vong theo số bước chân mỗi ngày</title><desc id="d">Tỷ số nguy cơ (HR) đã hiệu chỉnh so với nhóm đi ít nhất, kèm khoảng tin cậy 95%. Nhóm 2: 0,60; nhóm 3: 0,55; nhóm 4: 0,47.</desc>
<rect width="900" height="386" rx="14" fill="#fcfcfb"/>
<text x="24" y="30" font-size="17" font-weight="800" fill="#0b0b0b">Nguy cơ tử vong theo số bước chân mỗi ngày</text>
<line x1="402.5" y1="70" x2="402.5" y2="324" stroke="#e6e5e0" stroke-width="1"/><text x="402.5" y="344" text-anchor="middle" font-size="14" fill="#52514e">0,4</text><line x1="487.5" y1="70" x2="487.5" y2="324" stroke="#e6e5e0" stroke-width="1"/><text x="487.5" y="344" text-anchor="middle" font-size="14" fill="#52514e">0,6</text><line x1="572.5" y1="70" x2="572.5" y2="324" stroke="#e6e5e0" stroke-width="1"/><text x="572.5" y="344" text-anchor="middle" font-size="14" fill="#52514e">0,8</text><line x1="657.5" y1="70" x2="657.5" y2="324" stroke="#e6e5e0" stroke-width="1"/><text x="657.5" y="344" text-anchor="middle" font-size="14" fill="#52514e">1</text><line x1="657.5" y1="64" x2="657.5" y2="324" stroke="#0b0b0b" stroke-width="2"/><text x="657.5" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">1,0 = không đổi</text><text x="24" y="98" font-size="16" font-weight="700" fill="#0b0b0b">Nhóm 1 (đối chứng)</text><text x="24" y="118" font-size="13" fill="#52514e">trung vị 3.553 bước/ngày</text><circle cx="657.5" cy="101" r="8" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="106" font-size="15" font-weight="600" fill="#0b0b0b">1,00 (mốc so sánh)</text><text x="24" y="160" font-size="16" font-weight="700" fill="#0b0b0b">Nhóm 2</text><text x="24" y="180" font-size="13" fill="#52514e">trung vị 5.801 bước/ngày</text><line x1="449.2" y1="163" x2="534.2" y2="163" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="449.2" y1="156" x2="449.2" y2="170" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="534.2" y1="156" x2="534.2" y2="170" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="487.5" cy="163" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="168" font-size="15" font-weight="600" fill="#0b0b0b">0,60 (0,51 đến 0,71)</text><text x="24" y="222" font-size="16" font-weight="700" fill="#0b0b0b">Nhóm 3</text><text x="24" y="242" font-size="13" fill="#52514e">trung vị 7.842 bước/ngày</text><line x1="440.8" y1="225" x2="496.0" y2="225" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="440.8" y1="218" x2="440.8" y2="232" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="496.0" y1="218" x2="496.0" y2="232" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="466.2" cy="225" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="230" font-size="15" font-weight="600" fill="#0b0b0b">0,55 (0,49 đến 0,62)</text><text x="24" y="284" font-size="16" font-weight="700" fill="#0b0b0b">Nhóm 4</text><text x="24" y="304" font-size="13" fill="#52514e">trung vị 10.901 bước/ngày</text><line x1="398.2" y1="287" x2="474.8" y2="287" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="398.2" y1="280" x2="398.2" y2="294" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="474.8" y1="280" x2="474.8" y2="294" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><circle cx="432.2" cy="287" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="716" y="292" font-size="15" font-weight="600" fill="#0b0b0b">0,47 (0,39 đến 0,57)</text><text x="530" y="368" text-anchor="middle" font-size="14" fill="#52514e">Tỷ số nguy cơ tử vong (thấp hơn 1,0 là nguy cơ thấp hơn)</text><text x="24" y="384" font-size="12.5" fill="#52514e">Nguồn: Paluch và cs., Lancet Public Health 2022. 47.471 người, 3.013 ca tử vong. Nghiên cứu quan sát.</text></svg>