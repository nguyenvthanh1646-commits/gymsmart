<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Mỗi tuần nhiều hiệp hơn, tăng cơ nhiều hơn một chút (trung bình)</title><desc id="d">Mỗi hiệp thêm mỗi tuần tương ứng tăng thêm 0,37% mức tăng cơ. Nhóm nhiều hiệp hơn trong cùng nghiên cứu hơn 3,9%.</desc>
<rect width="900" height="256" rx="14" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="800" fill="#0b0b0b">Mỗi tuần nhiều hiệp hơn, tăng cơ nhiều hơn một chút (trung bình)</text>
<rect x="24" y="62" width="273" height="132" rx="14" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="42" y="116" font-size="38" font-weight="800" fill="#2a78d6">+0,37%</text><text x="42" y="142" font-size="14" fill="#52514e">mức tăng cơ cho mỗi hiệp tập</text><text x="42" y="162" font-size="14" fill="#52514e">thêm mỗi tuần (P = 0,002)</text><rect x="313" y="62" width="273" height="132" rx="14" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="331" y="116" font-size="38" font-weight="800" fill="#2a78d6">+3,9%</text><text x="331" y="142" font-size="14" fill="#52514e">chênh lệch tăng cơ giữa nhóm</text><text x="331" y="162" font-size="14" fill="#52514e">nhiều hiệp và nhóm ít hiệp</text><text x="331" y="182" font-size="14" fill="#52514e">trong cùng nghiên cứu (P =</text><rect x="603" y="62" width="273" height="132" rx="14" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="621" y="116" font-size="38" font-weight="800" fill="#2a78d6">15</text><text x="621" y="142" font-size="14" fill="#52514e">nghiên cứu, 34 nhóm điều trị</text><text x="621" y="162" font-size="14" fill="#52514e">được gộp</text><text x="24" y="248" font-size="12.5" fill="#52514e">Nguồn: Schoenfeld và cs., J Sports Sci 2017. Chia thành 3 mức (dưới 5, 5 đến 9, từ 10 hiệp) chỉ cho xu hướng (P = 0,074).</text></svg>