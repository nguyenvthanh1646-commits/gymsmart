<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Huyết áp đỉnh khi nâng nặng</title><desc id="d">Huyết áp đo trực tiếp ở động mạch: cuốn tạ một tay đến kiệt sức trung bình 255 trên 190 mmHg; đạp đùi hai chân trung bình 320 trên 250, một người vượt 480 trên 350</desc><rect width="900" height="385" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Huyết áp đỉnh khi nâng đến kiệt sức (mmHg)</text><line x1="90" y1="290" x2="860" y2="290" stroke="#e6e5e0"/><text x="80" y="295" text-anchor="end" font-size="13" fill="#52514e">0</text><line x1="90" y1="246" x2="860" y2="246" stroke="#e6e5e0"/><text x="80" y="251" text-anchor="end" font-size="13" fill="#52514e">100</text><line x1="90" y1="202" x2="860" y2="202" stroke="#e6e5e0"/><text x="80" y="207" text-anchor="end" font-size="13" fill="#52514e">200</text><line x1="90" y1="158" x2="860" y2="158" stroke="#e6e5e0"/><text x="80" y="163" text-anchor="end" font-size="13" fill="#52514e">300</text><line x1="90" y1="114" x2="860" y2="114" stroke="#e6e5e0"/><text x="80" y="119" text-anchor="end" font-size="13" fill="#52514e">400</text><line x1="90" y1="70" x2="860" y2="70" stroke="#e6e5e0"/><text x="80" y="75" text-anchor="end" font-size="13" fill="#52514e">500</text><rect x="172" y="178" width="42" height="112" rx="4" fill="#eb6834"/><text x="193" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">255</text><rect x="222" y="206" width="42" height="84" rx="4" fill="#2a78d6"/><text x="243" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">190</text><text x="218" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Cuốn tạ một tay</text><text x="218" y="330" text-anchor="middle" font-size="12.5" fill="#52514e">trung bình nhóm</text><rect x="429" y="149" width="42" height="141" rx="4" fill="#eb6834"/><text x="450" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">320</text><rect x="479" y="180" width="42" height="110" rx="4" fill="#2a78d6"/><text x="500" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">250</text><text x="475" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Đạp đùi hai chân</text><text x="475" y="330" text-anchor="middle" font-size="12.5" fill="#52514e">trung bình nhóm</text><rect x="686" y="79" width="42" height="211" rx="4" fill="#eb6834"/><text x="707" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">>480</text><rect x="736" y="136" width="42" height="154" rx="4" fill="#2a78d6"/><text x="757" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">>350</text><text x="732" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Đạp đùi, 1 người cao nhất</text><text x="732" y="330" text-anchor="middle" font-size="12.5" fill="#52514e">vượt mức</text><rect x="90" y="48" width="12" height="12" rx="3" fill="#eb6834"/><text x="108" y="59" font-size="13" fill="#52514e">Tâm thu</text><rect x="190" y="48" width="12" height="12" rx="3" fill="#2a78d6"/><text x="208" y="59" font-size="13" fill="#52514e">Tâm trương</text><text x="24" y="368" font-size="12.5" fill="#52514e">5 vận động viên thể hình, đo trực tiếp bằng ống thông động mạch. Nguồn: MacDougall và cs., J Appl Physiol 1985.</text></svg>