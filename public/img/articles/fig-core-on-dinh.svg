<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Độ ổn định cột thắt lưng: gồng bụng và hóp bụng</title><desc id="d">Biểu đồ cột nhóm. Gồng bụng cao hơn hóp bụng ở cả bốn điều kiện tải, trung bình 511 đến 555 so với 475 đến 533 Nm/rad; khác biệt có ý nghĩa thống kê (P nhỏ hơn 0,001)</desc><rect width="900" height="440" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Độ ổn định cột thắt lưng (Nm/rad), cao hơn là vững hơn</text><line x1="90" y1="350" x2="860" y2="350" stroke="#e6e5e0"/><text x="80" y="355" text-anchor="end" font-size="13" fill="#52514e">0</text><line x1="90" y1="257" x2="860" y2="257" stroke="#e6e5e0"/><text x="80" y="262" text-anchor="end" font-size="13" fill="#52514e">200</text><line x1="90" y1="163" x2="860" y2="163" stroke="#e6e5e0"/><text x="80" y="168" text-anchor="end" font-size="13" fill="#52514e">400</text><line x1="90" y1="70" x2="860" y2="70" stroke="#e6e5e0"/><text x="80" y="75" text-anchor="end" font-size="13" fill="#52514e">600</text><rect x="142" y="129" width="40" height="221" rx="4" fill="#eb6834"/><text x="162" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">475</text><rect x="188" y="111" width="40" height="239" rx="4" fill="#2a78d6"/><text x="208" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">511</text><text x="186" y="372" text-anchor="middle" font-size="14" fill="#52514e">Không tải</text><rect x="335" y="119" width="40" height="231" rx="4" fill="#eb6834"/><text x="355" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">496</text><rect x="381" y="104" width="40" height="246" rx="4" fill="#2a78d6"/><text x="401" y="97" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">527</text><text x="379" y="372" text-anchor="middle" font-size="14" fill="#52514e">Tải hai tay</text><rect x="527" y="108" width="40" height="242" rx="4" fill="#eb6834"/><text x="547" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">518</text><rect x="573" y="91" width="40" height="259" rx="4" fill="#2a78d6"/><text x="593" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">555</text><text x="571" y="372" text-anchor="middle" font-size="14" fill="#52514e">Tải tay trái</text><rect x="720" y="101" width="40" height="249" rx="4" fill="#eb6834"/><text x="740" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">533</text><rect x="766" y="95" width="40" height="255" rx="4" fill="#2a78d6"/><text x="786" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">546</text><text x="764" y="372" text-anchor="middle" font-size="14" fill="#52514e">Tải tay phải</text><rect x="90" y="394" width="12" height="12" rx="3" fill="#eb6834"/><text x="108" y="405" font-size="13.5" fill="#52514e">Hóp bụng</text><rect x="190" y="394" width="12" height="12" rx="3" fill="#2a78d6"/><text x="208" y="405" font-size="13.5" fill="#52514e">Gồng bụng</text><text x="24" y="430" font-size="12.5" fill="#52514e">Trung bình, 8 nam khỏe mạnh. Nguồn: Grenier và McGill, Arch Phys Med Rehabil 2007. Nghiên cứu phòng thí nghiệm nhỏ.</text></svg>