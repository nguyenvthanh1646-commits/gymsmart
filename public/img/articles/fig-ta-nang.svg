<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Tạ nhẹ (60% 1RM trở xuống) so với tạ nặng, khi tập đến sát kiệt sức</title><desc id="d">Sức mạnh 1RM tăng nhiều hơn với tạ nặng. Sức mạnh đẳng trường không khác biệt có ý nghĩa. Tăng cơ tương đương.</desc>
<rect width="900" height="288" rx="14" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="800" fill="#0b0b0b">Tạ nhẹ (60% 1RM trở xuống) so với tạ nặng, khi tập đến sát kiệt sức</text>
<rect x="24" y="56" width="852" height="48" rx="10" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="44" y="86" font-size="16" font-weight="700" fill="#0b0b0b">Sức mạnh tối đa (1RM)</text><text x="856" y="86" text-anchor="end" font-size="16" font-weight="700" fill="#2a78d6">▲  tạ nặng tăng nhiều hơn</text><rect x="24" y="116" width="852" height="48" rx="10" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="44" y="146" font-size="16" font-weight="700" fill="#0b0b0b">Sức mạnh đẳng trường</text><text x="856" y="146" text-anchor="end" font-size="16" font-weight="700" fill="#52514e">＝  không khác biệt có ý nghĩa</text><rect x="24" y="176" width="852" height="48" rx="10" fill="#ffffff" stroke="#e6e5e0" stroke-width="1.5"/><text x="44" y="206" font-size="16" font-weight="700" fill="#0b0b0b">Tăng kích thước cơ</text><text x="856" y="206" text-anchor="end" font-size="16" font-weight="700" fill="#52514e">＝  tương đương nhau</text><text x="24" y="280" font-size="12.5" fill="#52514e">Nguồn: Schoenfeld và cs., J Strength Cond Res 2017. 21 nghiên cứu, mọi hiệp tập đến sát kiệt sức. Đây là minh họa kết luận, không phải số đo.</text></svg>