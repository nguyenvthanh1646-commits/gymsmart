<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Gồng core trong 4 bước</title><desc id="d">Bốn bước: hít bụng, siết 360 độ, giữ khi nâng, thở ra sau điểm khó nhất</desc><rect width="900" height="290" rx="14" fill="#fcfcfb"/><text x="24" y="32" font-size="18" font-weight="800" fill="#0b0b0b">Gồng core trong 4 bước</text><rect x="24" y="54" width="201" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="58" cy="92" r="20" fill="#2a78d6"/><text x="58" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="88" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Hít bụng</text><text x="42" y="140" font-size="14" fill="#52514e">Hít bằng mũi, để bụng</text><text x="42" y="166" font-size="14" fill="#52514e">và sườn dưới nở ra</text><text x="42" y="192" font-size="14" fill="#52514e">(không nâng vai)</text><rect x="241" y="54" width="201" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="275" cy="92" r="20" fill="#2a78d6"/><text x="275" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="305" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Siết 360°</text><text x="259" y="140" font-size="14" fill="#52514e">Siết bụng như chuẩn bị</text><text x="259" y="166" font-size="14" fill="#52514e">đón một cú đấm, cả</text><text x="259" y="192" font-size="14" fill="#52514e">trước, hai bên và lưng</text><rect x="458" y="54" width="201" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="492" cy="92" r="20" fill="#2a78d6"/><text x="492" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="522" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Giữ khi nâng</text><text x="476" y="140" font-size="14" fill="#52514e">Giữ thân cứng suốt đoạn</text><text x="476" y="166" font-size="14" fill="#52514e">khó của động tác, lưng</text><text x="476" y="192" font-size="14" fill="#52514e">ở tư thế trung tính</text><rect x="675" y="54" width="201" height="165" rx="14" fill="#fff" stroke="#e6e5e0" stroke-width="1.5"/><circle cx="709" cy="92" r="20" fill="#2a78d6"/><text x="709" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text><text x="739" y="99" font-size="16.5" font-weight="800" fill="#0b0b0b">Thở ra</text><text x="693" y="140" font-size="14" fill="#52514e">Thở ra sau khi qua điểm</text><text x="693" y="166" font-size="14" fill="#52514e">khó nhất, rồi thả lỏng</text><text x="693" y="192" font-size="14" fill="#52514e">và lặp lại cho cái tiếp theo</text><text x="24" y="256" font-size="12.5" fill="#52514e">Hướng dẫn thực hành theo đồng thuận của huấn luyện viên, không phải kết quả của một nghiên cứu cụ thể. Tập với tạ rất nhẹ trước.</text></svg>