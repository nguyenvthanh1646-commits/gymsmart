<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">HIIT và cardio cường độ vừa: giảm mỡ tương đương, HIIT tốn ít thời gian hơn</title><desc id="d">Hiệu ứng lên khối mỡ toàn thân khi chạy: −0,82 với HIIT và −0,85 với cardio đều. HIIT cần ít hơn khoảng 40% thời gian tập.</desc>
<rect width="900" height="256" rx="14" fill="#fcfcfb"/>
<text x="24" y="30" font-size="17" font-weight="800" fill="#0b0b0b">HIIT và cardio cường độ vừa: giảm mỡ tương đương, HIIT tốn ít thời gian hơn</text>
<line x1="330" y1="64" x2="330" y2="204" stroke="#52514e" stroke-width="1.5"/><text x="24" y="96" font-size="16" font-weight="700" fill="#0b0b0b">HIIT</text><text x="24" y="116" font-size="13" fill="#52514e">thời gian tập: khoảng 60% so với cardio đều</text><path d="M330 80 H629.4 a4 4 0 0 1 4 4 V108 a4 4 0 0 1 -4 4 H330 Z" fill="#2a78d6"/><text x="643.4" y="102" font-size="16" font-weight="700" fill="#0b0b0b">−0,82</text><text x="24" y="160" font-size="16" font-weight="700" fill="#0b0b0b">Cardio cường độ vừa</text><text x="24" y="180" font-size="13" fill="#52514e">thời gian tập: 100% (mốc so sánh)</text><path d="M330 144 H640.5 a4 4 0 0 1 4 4 V172 a4 4 0 0 1 -4 4 H330 Z" fill="#eb6834"/><text x="654.5" y="166" font-size="16" font-weight="700" fill="#0b0b0b">−0,85</text><text x="515" y="232" text-anchor="middle" font-size="14" fill="#52514e">Mức giảm khối mỡ toàn thân (độ lớn hiệu ứng chuẩn hóa, càng dài càng giảm nhiều)</text><text x="24" y="252" font-size="12.5" fill="#52514e">Nguồn: Wewege và cs., Obes Rev 2017. 13 nghiên cứu, người thừa cân/béo phì 18 đến 45 tuổi. Chỉ số 60% suy ra từ mức “ít hơn khoảng 40%”.</text></svg>